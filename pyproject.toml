[build-system]
requires = ["setuptools>=46.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "periodicity"
description = "Useful tools for periodicity analysis in time series data."
readme = "README.md"
requires-python = ">=3.8, <3.11"
license = {text = "MIT"}
authors = [
    {name = "Eduardo Nunes", email = "dioph@pm.me"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "bottleneck",
    "celerite2 >= 0.2.0, < 0.3.3",
    "emcee >= 3.0",
    "george",
    "matplotlib",
    "numpy < 2",
    "pandas >= 1.2, < 1.5",
    "PyWavelets >= 0.5",
    "scipy >= 1.1",
    "tqdm",
    "xarray >= 0.20, < 2022",
]
dynamic = ["version"]

[project.optional-dependencies]
docs = ["jupyter >= 1.0", "myst-nb >= 0.17", "numpydoc", "pydata-sphinx-theme"]
test = ["black==22.3.0", "flake8", "isort", "pytest", "pytest-cov", "tox"]

[tool.setuptools.dynamic]
version = {attr = "periodicity.__version__"}

[tool.black]
line-length = 88
target-version = ["py38", "py39", "py310"]

[tool.isort]
profile = "black"
line_length = 88
force_sort_within_sections = true
src_paths = ["src"]

[tool.coverage.run]
branch = true
source = ["src", "tests"]
parallel = true

[tool.coverage.paths]
source = ["src"]

[tool.coverage.report]
show_missing = true
precision = 2

[tool.pytest.ini_options]
testpaths = ["tests"]
